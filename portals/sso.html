<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoRT SSO | Sovereign Identity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050608;
            --bg-card: rgba(10, 12, 18, 0.7);
            --border-card: rgba(212, 175, 55, 0.15);
            --gold: #d4af37;
            --gold-bright: #f9d71c;
            --aurum-gradient: linear-gradient(135deg, #d4af37 0%, #f9d71c 100%);
            --text-primary: #ffffff;
            --glass-blur: blur(20px);
        }

        @keyframes holoPulse {
            0% { opacity: 0.1; transform: translateY(0) scale(1) rotate(0deg); }
            50% { opacity: 0.2; transform: translateY(-20px) scale(1.02) rotate(1deg); }
            100% { opacity: 0.1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            background-image: url('shared-assets/branding/desktop_bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .holo-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            pointer-events: none; z-index: -1;
        }
        .holo-bg::after {
            content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.03; animation: holoPulse 30s ease-in-out infinite;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 0%, var(--bg-deep) 100%);
            pointer-events: none; z-index: -1;
        }

        .sso-card {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-card);
            border-radius: 32px;
            padding: 3.5rem;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .sso-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--aurum-gradient);
            opacity: 0.5;
            border-radius: 32px 32px 0 0;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            background: var(--aurum-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--gold);
            margin-bottom: 3rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            margin-left: 0.5rem;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 1.2rem;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .login-btn {
            width: 100%;
            background: var(--aurum-gradient);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 1.3rem;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 1.5rem;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            filter: brightness(1.1);
        }

        .success-state { display: none; }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            text-align: left;
            background: rgba(255,255,255,0.03);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-card);
        }
        .avatar {
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--aurum-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 800; color: #000;
        }
        .dd-balance { color: #00ff88; font-weight: 800; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="holo-bg"></div>
    <div class="overlay"></div>

    <div class="sso-card">
        <div class="logo">KoRTx</div>
        <div class="tagline">Sovereign Identity</div>
        
        <div id="loginForm">
            <div class="input-group">
                <label>Kingdom Identity</label>
                <input type="text" value="TheHuman" readonly>
            </div>
            <button class="login-btn" onclick="handleLogin()">Authorize Access</button>
        </div>

        <div class="success-state" id="successState">
            <div style="color: #00ff88; font-weight: 800; margin-bottom: 2rem;">✓ IDENTITY VERIFIED</div>
            <div class="profile-info">
                <div class="avatar">H</div>
                <div>
                    <div style="font-weight: 800; font-size: 1.1rem;">The Human</div>
                    <div style="font-size: 0.8rem; color: var(--gold);">King of KoRT</div>
                    <div class="dd-balance" id="ssoBalance">1,250.00 DD</div>
                </div>
            </div>
            <button class="login-btn" style="background: rgba(255,255,255,0.05); color: #fff;" onclick="window.location.href='KORT_MASTER_PORTAL.html'">Enter Kingdom</button>
        </div>
    </div>

    <script>
        function updateSSOBalance() {
            let balance = 1250.00;
            const savedBalance = localStorage.getItem('kortx_balance');
            if (savedBalance !== null) {
                balance = parseFloat(savedBalance);
            } else {
                localStorage.setItem('kortx_balance', balance.toFixed(2));
            }
            const ssoBalanceEl = document.getElementById('ssoBalance');
            if (ssoBalanceEl) {
                ssoBalanceEl.innerText = `${balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} DD`;
            }
        }

        function handleLogin() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
            localStorage.setItem('kortx_session', 'active');
            updateSSOBalance();
        }

        window.onload = function() {
            if (localStorage.getItem('kortx_session') === 'active') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('successState').style.display = 'block';
                updateSSOBalance();
            }
        };
    </script>
</body>
</html>
