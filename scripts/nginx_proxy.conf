server {
    listen 80;
    server_name ide.kortx.ca api.kortx.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.kortx.ca;

    ssl_certificate /etc/letsencrypt/live/kortx.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kortx.ca/privkey.pem;

    # Route Flutter Apps / IDE to the FastAPI Sovereign Proxy
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name ide.kortx.ca;

    ssl_certificate /etc/letsencrypt/live/kortx.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kortx.ca/privkey.pem;

    # Route to VS_KoRT_Code (Code-Server) Instance
    location / {
        proxy_pass http://127.0.0.1:8443/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
