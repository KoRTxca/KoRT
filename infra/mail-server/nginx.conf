user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
                    
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Dynamic Let's Encrypt / HTTP challenge handler
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Stalwart Mail Server Admin Dashboard & Autoconfig Gateway
    server {
        listen 443 ssl;
        server_name mail.drt.onl mail.kortx.ca mail.drt.social;

        ssl_certificate /etc/letsencrypt/live/mail.drt.onl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mail.drt.onl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://stalwart:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Snappymail Webmail Portal
    server {
        listen 443 ssl;
        server_name webmail.drt.onl webmail.kortx.ca webmail.drt.social;

        ssl_certificate /etc/letsencrypt/live/mail.drt.onl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mail.drt.onl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://webmail:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }
    }
}
